{{- $lang := .Type | default "text" -}}
<div class="code-block-container" data-lang="{{ $lang }}">
  <div class="code-block-header">
    <span class="code-block-lang">{{ $lang }}</span>
    <button class="code-copy-btn" type="button" aria-label="Copy code to clipboard" title="Copy code">
      <i class="fa-regular fa-clipboard copy-icon"></i>
      <span class="copy-text">Copy</span>
    </button>
  </div>
  {{- transform.Highlight .Inner $lang .Options -}}
</div>
