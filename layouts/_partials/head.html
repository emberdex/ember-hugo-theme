<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>

{{- with or .Description site.Params.description site.Params.subtitle }}
<meta name="description" content="{{ . }}">
{{- end }}
<meta name="author" content="{{ site.Params.author | default site.Title }}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ .Permalink }}">

{{- with site.Home.OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">
{{- end }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/b3bf70586d.js" crossorigin="anonymous"></script>

<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ or .Description site.Params.description site.Params.subtitle }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ site.Title }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta name="twitter:description" content="{{ or .Description site.Params.description site.Params.subtitle }}">

{{- if (fileExists "static/favicon.ico") }}
<link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
{{- end }}

{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
