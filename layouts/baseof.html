<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en-GB` }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  <script>
    (function() {
      const LOCAL_STORAGE_KEY_CURRENT_THEME = 'ember-hugo-current-theme';

      const DARK_THEME_MEDIA_QUERY = '(prefers-color-scheme: dark)';

      const DARK_THEME = 'dark';
      const LIGHT_THEME = 'light';

      try {
        const stored = localStorage.getItem(LOCAL_STORAGE_KEY_CURRENT_THEME);
        const theme = stored || (window.matchMedia(DARK_THEME_MEDIA_QUERY).matches ? DARK_THEME : LIGHT_THEME);
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-wrapper">
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
